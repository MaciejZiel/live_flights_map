# Public demo in one container: synthetic traffic, read-only, no API keys.
#   docker compose -f compose.demo.yaml up --build -d
name: live-flights-map-demo

services:
  demo:
    build:
      context: .
      dockerfile: Dockerfile.demo
    environment:
      DEMO_FLIGHT_COUNT: ${DEMO_FLIGHT_COUNT:-900}
      DEMO_RATE_LIMIT_PER_MINUTE: ${DEMO_RATE_LIMIT_PER_MINUTE:-240}
    ports:
      - "127.0.0.1:${DEMO_PORT:-8080}:10000"
    volumes:
      - demo-data:/data
    restart: unless-stopped

volumes:
  demo-data:
