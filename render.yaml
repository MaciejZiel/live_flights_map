# Render Blueprint for the public demo (synthetic traffic, read-only API).
# Deploy: https://render.com/deploy?repo=https://github.com/MaciejZiel/live_flights_map
services:
  - type: web
    name: live-flights-map-demo
    runtime: docker
    plan: free
    region: frankfurt
    branch: master
    autoDeploy: true
    dockerfilePath: ./Dockerfile.demo
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: DEMO_MODE
        value: "true"
      # Render's proxy sets X-Forwarded-For; key the per-client limit on it.
      - key: DEMO_TRUST_PROXY_HEADERS
        value: "true"
      - key: DEMO_RATE_LIMIT_PER_MINUTE
        value: "240"
      - key: DEMO_GLOBAL_RATE_LIMIT_PER_MINUTE
        value: "3000"
      # 512 MB RAM on the free plan: keep the fleet and archive modest.
      - key: DEMO_FLIGHT_COUNT
        value: "900"
      - key: FLIGHT_ARCHIVE_RETENTION_HOURS
        value: "3"
    # Optional, paid plans only: keep the archive across restarts and deploys.
    # Without a disk the archive is rebuilt (backfilled) on every start, which
    # is enough for the demo. After enabling it, check /health
    # (services.archive.available) to confirm the container can write to it.
    # disk:
    #   name: flight-data
    #   mountPath: /data
    #   sizeGB: 1
